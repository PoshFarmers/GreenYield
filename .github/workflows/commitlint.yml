name: Lint commit messages

on:
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          git fetch origin "${{ github.base_ref }}"

          pattern='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9_-]+\))?: .{1,}$'
          failed=0

          for sha in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            msg=$(git log -1 --format=%s "$sha")
            if ! [[ "$msg" =~ $pattern ]]; then
              echo "Bad commit message ($sha): $msg"
              failed=1
            fi
          done

          exit $failed